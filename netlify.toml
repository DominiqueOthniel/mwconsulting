[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "file:./dev.db"
  AUTH_SECRET = "relais-mw-consulting-netlify-demo"

[[plugins]]
